      field: {difficulty: 4, stars: 2, note: "박물관 내부 인파가 많아 휠체어로는 원하는 작품을 관람하기 어려웠다."}
    - name: "노트르담–시테섬–퐁네프"
      time_label: "~75분"
      stops:
        - {name: "노트르담 대성당", lon: 2.3499, lat: 48.853}
        - {name: "시테섬 북단 산책로", lon: 2.341, lat: 48.857}
        - {name: "퐁네프", lon: 2.339, lat: 48.8577}
      field: {difficulty: 2, stars: 5, note: "계단이 없어 관광하기 쉬웠고, 센 강 주변에서 휠체어 여행자를 많이 볼 수 있었다."}
