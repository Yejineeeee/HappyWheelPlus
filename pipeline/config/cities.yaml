- id: london
  name_ko: 런던
  country_ko: 영국
  radius_m: 2700  # 3000 m에서는 gzip 2.18 MB로 한도 초과
  courses:
    - name: "사우스뱅크 무계단 루프"
      time_label: "~90분"
      stops:
        - {name: "타워 브리지", lon: -0.0754, lat: 51.5055}
        - {name: "버러 마켓", lon: -0.091, lat: 51.505}
        - {name: "테이트 모던", lon: -0.097, lat: 51.507}
        - {name: "세인트 폴 대성당", lon: -0.0984, lat: 51.5138}
      field: {difficulty: 3, stars: 3, note: "관광객이 많아 휠체어로 이동하기 쉽지 않았고, 계단이 있어 가까이 가기 어려운 곳이 있었다."}
    - name: "웨스트민스터–세인트 제임스–트라팔가"
      time_label: "~80분"
      stops:
        - {name: "웨스트민스터 브리지", lon: -0.123, lat: 51.5}
        - {name: "세인트 제임스 파크", lon: -0.134, lat: 51.504}
        - {name: "트라팔가 광장", lon: -0.128, lat: 51.507}
      field: {difficulty: 2, stars: 4, note: "사원 내부는 어렵지 않았지만 외부에 횡단보도가 많아 길을 건너기 힘들었다."}
- id: paris
  name_ko: 파리
  country_ko: 프랑스
  radius_m: 1800  # 3000 m에서는 gzip 2.24 MB로 한도 초과 (가장 먼 정류장 1258 m + 500 m)
  courses:
    - name: "루브르–뛸르리–오랑주리"
      time_label: "~60분"
      stops:
