[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "happywheel"
version = "0.1.0"
description = "HappyWheel+ accessibility data pipeline"
requires-python = ">=3.11"
dependencies = [
    "osmnx>=2.0,<3",
    "networkx>=3.2",
    "shapely>=2.0",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
