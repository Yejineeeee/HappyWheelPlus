<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <title>HappyWheel+ · PWA v5</title>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#3A66FF"/>
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header class="app-header">
    <button id="backBtn" class="icon-btn" aria-label="뒤로가기">←</button>
    <div class="brand">HappyWheel+</div>
    <button id="menuBtn" class="icon-btn" aria-label="메뉴">≡</button>
  </header>

  <aside id="drawer" class="drawer">
    <div class="drawer-top">
      <div class="drawer-title">메뉴</div>
      <button id="closeDrawer" class="icon-btn" aria-label="닫기">✕</button>
    </div>
    <div class="drawer-body">
      <div class="list-item-header">앱 소개</div>
      <p class="drawer-text">휠체어 사용자에게 유리한 코스(무계단·저경사·필수 편의시설)를 보여주는 모바일 웹앱입니다. 나라→도시→코스→지도→길안내 순서로 이용하세요.</p>
      <div class="list-item-header">OpenRouteService 키</div>
      <div class="row">
        <input id="orsKeyInput" placeholder="ORS API 키 입력"/>
        <button id="saveKeyBtn" class="btn">저장</button>
      </div>
      <small class="drawer-text">키가 없으면 경유지 직선 경로로 표시합니다.</small>
      <div class="list-item-header">앱 초기화</div>
      <button id="resetAppBtn" class="btn">캐시/설정 초기화</button>
      <label class="toggle-row"><input type="checkbox" id="locToggle"> 현재 위치 표시</label>
      <label class="toggle-row"><input type="checkbox" id="contrastToggle"> 고대비 모드</label>
    </div>
  </aside>
  <div id="scrim" class="scrim"></div>

  <main id="views">
    <section id="v-home" class="view">
      <div class="panel">
        <h2>여행할 나라 선택</h2>
        <div id="countryGrid" class="grid"></div>
      </div>
    </section>

    <section id="v-cities" class="view hidden">
      <div class="panel">
        <h2 id="citiesTitle">도시 선택</h2>
        <div id="cityGrid" class="grid"></div>
      </div>
    </section>

    <section id="v-courses" class="view hidden">
      <div class="panel">
        <h2 id="courseCity">도시 추천 코스</h2>
        <ul id="courseList" class="list"></ul>
      </div>
    </section>

    <section id="v-map" class="view hidden" aria-label="지도">
      <div id="map"></div>
      <div class="map-overlay">
        <div class="chip-row">
          <button class="chip on" data-layer="toilet">화장실</button>
          <button class="chip on" data-layer="elevator">엘리베이터</button>
          <button class="chip on" data-layer="bench">벤치</button>
          <button class="chip on" data-layer="fountain">음수대</button>
        </div>
      </div>
    </section>

    <section id="v-nav" class="view hidden">
      <div class="panel">
        <h2>길 안내</h2>
        <div id="navInfo" class="nav-info">코스를 선택하면 실제 경로를 계산하여 단계별 힌트를 보여줍니다.</div>
        <ol id="turnList" class="turn-list"></ol>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-to="v-home">🏠<div class="tab-txt">홈</div></button>
    <button class="tab" data-to="v-cities">🗺️<div class="tab-txt">도시</div></button>
    <button class="tab" data-to="v-courses">🧭<div class="tab-txt">코스</div></button>
    <button class="tab" data-to="v-map">🗼<div class="tab-txt">지도</div></button>
    <button class="tab" data-to="v-nav">✅<div class="tab-txt">길안내</div></button>
  </nav>

  <div id="sheet" class="sheet">
    <div class="sheet-head">
      <div id="sheetTitle" class="sheet-title">제목</div>
      <button id="closeSheet" class="icon-btn" aria-label="닫기">✕</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
  <div id="sheetScrim" class="scrim"></div>

  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(()=>{});
      });
    }
  </script>
</body>
</html>
