name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: 파이프라인 테스트
        run: |
          pip install -e ".[test]"
          pytest -q
        working-directory: pipeline

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 웹 설치와 테스트, 빌드
        run: |
          npm ci
          npm test
          npm run build
        working-directory: web
        env:
          VITE_AI_ENDPOINT: ${{ vars.VITE_AI_ENDPOINT }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 웹 설치
        run: npm ci
        working-directory: web
      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: 스모크 테스트
        run: npm run e2e
        working-directory: web
        env:
          CI: "true"

  deploy:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
