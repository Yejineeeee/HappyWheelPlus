name = "happywheel-ai"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
# 주의: gpt-5, o 시리즈 모델은 temperature, max_tokens를 받지 않는다.
# 모델을 바꿀 때는 이 값을 지원하는 모델을 쓰거나 src/openai.ts를 함께 고친다.
OPENAI_MODEL = "gpt-4o-mini"
ALLOWED_ORIGINS = "https://yejineeeee.github.io,http://localhost:5173,http://localhost:4173"
DAILY_LIMIT_PER_IP = "5"
DAILY_LIMIT_TOTAL = "300"

# 사용 한도 기록용 KV. 배포 전에 `npx wrangler kv namespace create LIMITS`로 만들고
# 아래 id를 출력된 값으로 바꾼다.
[[kv_namespaces]]
binding = "LIMITS"
id = "7ba3fe152f744cb988d581994a95067b"

# OPENAI_API_KEY는 비밀값이라 파일에 넣지 않는다: `npx wrangler secret put OPENAI_API_KEY`
